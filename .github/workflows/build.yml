name: 构建多平台打包

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ============================================================
  # Windows: PyInstaller + Kivy GUI → vipmovie.exe
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install pyinstaller pillow requests beautifulsoup4 kivy

      - name: 转换图标
        run: |
          python -c "from PIL import Image; img = Image.open('icon.png'); img.save('icon.ico', format='ICO', sizes=[(256,256)])"

      - name: 构建 exe
        run: pyinstaller --onefile --noconsole --icon=icon.ico --name vipmovie main.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: vipmovie-Windows
          path: dist/vipmovie.exe

  # ============================================================
  # Linux: PyInstaller + Kivy GUI → vipmovie
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev libgles2-mesa-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: 安装 Python 依赖
        run: pip install pyinstaller requests beautifulsoup4 kivy

      - name: 构建二进制
        run: pyinstaller --onefile --noconsole --name vipmovie main.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: vipmovie-Linux
          path: dist/vipmovie

  # ============================================================
  # Android: kivy/buildozer Docker → vipmovie.apk
  # ============================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Buildozer (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-v2-

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}-v1

      - name: 构建 APK
        run: |
          docker run --rm \
            -v $HOME/.buildozer:/home/user/.buildozer \
            -v $HOME/.gradle:/home/user/.gradle \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            kivy/buildozer android debug

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: vipmovie-Android
          path: bin/*.apk
